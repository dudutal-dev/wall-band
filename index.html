<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>להקת הקיר</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Karantina:wght@400;700&family=Rubik:wght@400;500;700&display=swap">
<style>
/* Layout: one phone screen over a live light-show canvas. Game: status bar, record deck with a beat ring, 2x2 band of wall faces. Home: record shelf. */
:root{
  color-scheme:dark;
  --wall:#170d22; --wall-hi:#2c1746; --neon:#b56cff; --neon-soft:rgba(181,108,255,.35);
  --ink:#110a18; --paper:#f4eadd; --muted:#c9bcd8; --veil:rgba(17,10,24,.55); --veil-strong:rgba(17,10,24,.88);
  --blue:#3f7fd6; --pink:#cf5b84; --olive:#8a9a4b; --yellow:#f2bb1f;
  --wood:#6b4630; --wood-dark:#3d2618; --bad:#ff5a4d;
  --display:"Karantina","Rubik","Arial Hebrew",Arial,sans-serif;
  --body:"Rubik","Arial Hebrew",Arial,sans-serif;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{height:100%;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
body{
  margin:0;height:100%;overflow:hidden;font-family:var(--body);font-size:16px;color:var(--paper);
  background:radial-gradient(120% 60% at 50% 0%,var(--wall-hi),var(--wall) 70%) var(--wall);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation;
}
#bg,#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}
#bg{z-index:0}#fx{z-index:4}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
button:focus-visible{outline:3px solid var(--neon);outline-offset:3px}
.screen{height:100%;max-width:460px;margin:0 auto;display:flex;flex-direction:column;gap:10px;padding-block:12px;position:relative;z-index:1}

/* home */
.logo{font-family:var(--display);font-weight:700;font-size:clamp(60px,21vw,100px);line-height:.8;margin:14px 0 0;
  text-shadow:0 0 22px var(--neon-soft),0 0 2px var(--neon),0 2px 0 var(--ink)}
.sub{color:var(--paper);margin:0;line-height:1.45;max-width:31ch;text-shadow:0 1px 4px var(--ink)}
.shelf{flex:1;min-height:0;overflow-y:auto;display:grid;grid-template-columns:repeat(3,1fr);gap:18px 12px;align-content:start;padding-top:6px}
.slot{display:flex;flex-direction:column;gap:4px;text-align:center;border-bottom:8px solid var(--wood);
  box-shadow:0 10px 0 -2px var(--wood-dark);padding-bottom:5px}
.sleeve{aspect-ratio:1;width:100%;border-radius:3px;position:relative;overflow:hidden;box-shadow:0 4px 14px var(--ink);display:block}
.sleeve svg{position:absolute;inset:0;width:100%;height:100%}
.sleeve b{position:absolute;inset:auto 0 0 0;padding:14px 6px 5px;font-family:var(--display);font-weight:400;font-size:21px;line-height:.9;
  text-align:start;color:var(--paper);background:linear-gradient(transparent,var(--veil-strong))}
.slot.locked .sleeve{filter:grayscale(1) brightness(.38)}
.genre{font-size:11px;color:var(--muted);text-shadow:0 1px 3px var(--ink)}
.stars{font-size:13px;letter-spacing:2px;color:var(--yellow);min-height:17px;text-shadow:0 1px 3px var(--ink)}
.stars i{font-style:normal;color:var(--muted);opacity:.45}
.row{display:flex;gap:10px;align-items:center}
.cta{flex:1;background:var(--neon);color:var(--ink);font-family:var(--display);font-weight:700;font-size:36px;line-height:1;
  padding:11px 20px 13px;border-radius:999px;box-shadow:0 0 26px var(--neon-soft)}
.cta:active,.alt:active{transform:scale(.97)}
.alt{font-family:var(--display);font-size:26px;line-height:1;padding:14px 18px 16px;border-radius:999px;border:2px solid var(--neon);background:var(--veil)}
.ghost{color:var(--muted);padding:8px;text-decoration:underline;text-underline-offset:4px}

/* game */
.hud{display:flex;align-items:center;justify-content:space-between;gap:10px}
.hud .name{text-align:center;min-width:0}
.hud h2{font-family:var(--display);font-size:32px;line-height:.95;margin:0;font-weight:700;text-shadow:0 2px 6px var(--ink)}
.lives{display:flex;gap:5px}
.lives b{width:16px;height:16px;border-radius:50%;background:radial-gradient(circle,var(--neon) 0 28%,var(--ink) 30%);border:1px solid var(--muted)}
.lives b.gone{opacity:.2}
.stage{position:relative;display:flex;flex-direction:column;align-items:center;gap:4px}
#say{margin:0;font-family:var(--display);font-size:38px;line-height:1;min-height:38px;text-shadow:0 2px 8px var(--ink)}
#deck{width:min(62vw,31vh,270px);aspect-ratio:1;display:block}
#judge{position:absolute;top:50%;left:0;right:0;text-align:center;font-family:var(--display);font-weight:700;font-size:64px;line-height:1;
  pointer-events:none;opacity:0;text-shadow:0 0 18px var(--neon),0 3px 0 var(--ink)}
#judge.pop{animation:pop .55s ease-out}
#judge.bad{color:var(--bad);text-shadow:0 3px 0 var(--ink)}
@keyframes pop{0%{opacity:0;transform:scale(.6)}25%{opacity:1;transform:scale(1.1)}100%{opacity:0;transform:scale(1) translateY(-22px)}}
.meter{display:flex;justify-content:space-between;align-items:center;width:100%;font-variant-numeric:tabular-nums;text-shadow:0 1px 4px var(--ink)}
.dots{display:flex;gap:6px}
.dots b{width:12px;height:12px;border-radius:50%;border:2px solid var(--paper);opacity:.55}
.dots b.hit{background:var(--neon);border-color:var(--neon);opacity:1;box-shadow:0 0 8px var(--neon)}
.band{flex:1;min-height:0;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:4px;direction:ltr}
.band.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-8px)}50%{transform:translateX(8px)}75%{transform:translateX(-5px)}}
.pad{min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;transition:transform .07s,filter .07s;
  filter:drop-shadow(0 3px 8px var(--ink))}
.pad svg{flex:1;min-height:0;width:100%;overflow:visible}
.pad span{font-size:12px;font-weight:500;letter-spacing:.06em;padding:1px 9px;border-radius:999px;background:var(--veil);color:var(--paper)}
.pad .open{display:none}
.pad.on{transform:scale(1.08);filter:brightness(1.25) drop-shadow(0 0 18px var(--glow))}
.pad.on .open{display:block}.pad.on .shut{display:none}

/* overlay */
.over{position:fixed;inset:0;z-index:5;background:var(--veil-strong);display:flex;align-items:center;justify-content:center;
  padding:24px max(24px,env(safe-area-inset-right,0px)) 24px max(24px,env(safe-area-inset-left,0px))}
.card{width:100%;max-width:340px;display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center}
.card h3{font-family:var(--display);font-size:64px;line-height:.85;margin:0}
.card p{margin:0;color:var(--muted);line-height:1.45}
.card .sleeve{width:170px}.card .sleeve b{font-size:30px;padding:20px 10px 8px}
.card .stars{font-size:28px}
.card .cta{flex:none}
@media (prefers-reduced-motion:reduce){.band.shake{animation:none}.pad{transition:none}}
</style>
</head>
<body>
<canvas id="bg" aria-hidden="true"></canvas>

<main class="screen" id="home">
  <h1 class="logo">להקת<br>הקיר</h1>
  <p class="sub">הלהקה מנגנת ריף על הקצב, ואתם עונים לה באותו קצב. ריף נקי מוסיף תקליט למדף.</p>
  <div class="shelf" id="shelf"></div>
  <div class="row">
    <button class="cta" id="play">לנגן</button>
    <button class="alt" id="jam">ג׳אם חופשי</button>
  </div>
</main>

<main class="screen" id="game" hidden>
  <div class="hud">
    <button class="ghost" id="back">למדף</button>
    <div class="name"><h2 id="albumName"></h2><span class="genre" id="genre"></span></div>
    <div class="lives" id="lives" aria-label="ניסיונות שנותרו"></div>
  </div>
  <div class="stage">
    <p id="say" aria-live="polite"></p>
    <canvas id="deck" aria-hidden="true"></canvas>
    <div id="judge"></div>
    <div class="meter">
      <span id="score"></span>
      <span class="dots" id="dots"></span>
      <button class="ghost" id="swap" hidden>להחליף סגנון</button>
    </div>
  </div>
  <div class="band" id="band"></div>
</main>

<div class="over" id="over" hidden>
  <div class="card">
    <h3 id="ovTitle"></h3>
    <div class="sleeve" id="ovSleeve"></div>
    <div class="stars" id="ovStars"></div>
    <p id="ovText"></p>
    <button class="cta" id="ovMain"></button>
    <button class="ghost" id="ovHome">חזרה למדף</button>
  </div>
</div>
<canvas id="fx" aria-hidden="true"></canvas>

<script>
document.documentElement.lang='he';document.documentElement.dir='rtl';
const $=id=>document.getElementById(id),TAU=Math.PI*2;
const F=m=>440*Math.pow(2,(m-69)/12);
const PADC=['#3f7fd6','#cf5b84','#8a9a4b','#f2bb1f'],PADN=['בס','קלידים','גיטרה','תופים'];

/* Each record is a genre from the shelf: its own groove, chords, instruments and light show. */
const ALBUMS=[
 {name:'ניאון סגול',genre:'פרוג חללי',bpm:72,swing:0,root:40,prog:[[0,3],[0,3],[8,4],[10,4]],k:[0,5],s:[4],h:[0,2,4,6],
  bl:[0,,,0,,,7,,],keys:'synth',drive:.5,glen:.9,dly:.5,rev:.5,pad:.1,kind:0,pal:[[.10,.04,.28],[.45,.18,.95],[1,.45,.85]],P:4,off:.3,label:'#7a2fd0'},
 {name:'בוקר על הנהר',genre:'ג׳אם פסיכדלי',bpm:96,swing:.15,root:38,prog:[[0,4],[10,4],[5,4],[0,4]],k:[0,3,4],s:[2,6],h:[0,1,2,3,4,5,6,7],
  bl:[0,,7,,12,,7,,],keys:'organ',drive:1,glen:.45,dly:.3,rev:.35,pad:.06,kind:1,pal:[[.05,.25,.35],[.95,.35,.15],[1,.85,.25]],P:4,off:.6,label:'#3d8fc9'},
 {name:'בלוז של חצות',genre:'בלוז־רוק',bpm:104,swing:.33,root:45,prog:[[0,4],[5,4],[0,4],[7,4]],k:[0,4],s:[2,6],h:[0,1,2,3,4,5,6,7],
  bl:[0,,4,,7,,9,,],keys:'organ',drive:3,glen:.4,dly:.12,rev:.3,pad:0,kind:1,pal:[[.03,.06,.22],[.15,.3,.75],[1,.65,.2]],P:5,off:1,label:'#1f3a6b'},
 {name:'נשמה חמה',genre:'סול רטרו',bpm:112,swing:.12,root:42,prog:[[0,3],[0,3],[5,3],[7,4]],k:[0,3,5],s:[2,6],h:[0,1,2,3,4,5,6,7],
  bl:[0,,0,7,,10,12,,],keys:'brass',drive:.6,glen:.25,dly:.1,rev:.3,pad:0,kind:2,pal:[[.3,.08,.03],[.9,.4,.1],[1,.85,.4]],P:5,off:1.3,label:'#c2562c'},
 {name:'אבק כוכבים',genre:'גלאם',bpm:126,swing:0,root:43,prog:[[0,4],[5,4],[7,4],[5,4]],k:[0,4],s:[2,6],clap:1,h:[0,2,4,6],
  bl:[0,0,0,0,0,0,0,0],keys:'piano',drive:2.5,glen:.35,dly:.1,rev:.35,pad:0,kind:2,pal:[[.2,.05,.3],[.95,.3,.6],[1,.9,.45]],P:5,off:1,label:'#cf5b84'},
 {name:'מועדון המרתף',genre:'ביט בריטי',bpm:138,swing:0,root:36,prog:[[0,4],[9,3],[5,4],[7,4]],k:[0,3,4],s:[2,6],clap:1,h:[0,1,2,3,4,5,6,7],
  bl:[0,,7,,0,,7,,],keys:'organ',drive:.8,glen:.3,dly:.08,rev:.3,pad:0,kind:3,pal:[[.08,.12,.4],[.85,.15,.15],[.97,.92,.8]],P:5,off:1.5,label:'#b8242a'},
];
const HOME={kind:0,pal:[[.09,.03,.2],[.4,.15,.8],[.8,.4,1]]};

/* ---------- sleeve art, in the flat cut-out style of the wall ---------- */
function cover(i){
  const s=[
   `<rect width="100" height="100" fill="#1b0f3a"/><circle cx="50" cy="44" r="22" fill="#b56cff"/><ellipse cx="50" cy="44" rx="40" ry="9" fill="none" stroke="#ff7ad9" stroke-width="4" transform="rotate(-18 50 44)"/><path d="M28 44A22 22 0 0 1 72 44Z" fill="#b56cff"/><circle cx="16" cy="18" r="2" fill="#f4eadd"/><circle cx="84" cy="24" r="1.5" fill="#f4eadd"/><circle cx="78" cy="74" r="2" fill="#f4eadd"/>`,
   `<rect width="100" height="100" fill="#3d8fc9"/><circle cx="68" cy="28" r="14" fill="#f2c04a"/><path d="M0 62Q30 44 55 58T100 50V100H0Z" fill="#2c5d4f"/><path d="M0 84Q25 70 50 80T100 72V100H0Z" fill="#9fd6e8"/><path d="M0 92Q25 80 50 90T100 84" fill="none" stroke="#f4eadd" stroke-width="2"/>`,
   `<rect width="100" height="100" fill="#0d1830"/><circle cx="62" cy="32" r="18" fill="#f2bb1f"/><circle cx="54" cy="27" r="16" fill="#0d1830"/><path d="M0 100V70H18V58H34V76H52V64H70V80H84V68H100V100Z" fill="#1f3a6b"/><rect x="22" y="64" width="4" height="4" fill="#f2bb1f"/><rect x="58" y="70" width="4" height="4" fill="#f2bb1f"/>`,
   `<rect width="100" height="100" fill="#6b2a12"/>${Array.from({length:12},(_,k)=>`<path d="M50 46L44 -10H56Z" fill="#f2a01f" transform="rotate(${k*30} 50 46)"/>`).join('')}<circle cx="50" cy="46" r="20" fill="#f4eadd"/><circle cx="50" cy="46" r="7" fill="#c2562c"/>`,
   `<rect width="100" height="100" fill="#3a1c5c"/><path d="M50 10L60 36H88L65 52L74 80L50 62L26 80L35 52L12 36H40Z" fill="#ffe27a"/><circle cx="18" cy="16" r="3" fill="#cf5b84"/><circle cx="84" cy="14" r="2" fill="#cf5b84"/><circle cx="88" cy="66" r="3" fill="#cf5b84"/><circle cx="12" cy="70" r="2" fill="#cf5b84"/>`,
   `<rect width="100" height="100" fill="#f4eadd"/>${[44,35,26,17,8].map((r,k)=>`<rect x="${50-r}" y="${46-r}" width="${r*2}" height="${r*2}" fill="${k%2?'#16306e':'#b8242a'}" transform="rotate(${k*9} 50 46)"/>`).join('')}`,
  ];
  return `<svg viewBox="0 0 100 100" preserveAspectRatio="xMidYMid slice" aria-hidden="true">${s[i]}</svg><b>${ALBUMS[i].name}</b>`;
}

/* ---------- saved progress ---------- */
let save={s:{},b:{}};
try{const j=JSON.parse(localStorage.getItem('wallband2')||'null');if(j&&j.s)save=j}catch(e){}
const persist=()=>{try{localStorage.setItem('wallband2',JSON.stringify(save))}catch(e){}};
const unlocked=i=>i===0||save.s[i-1]>0;
const nextUp=()=>{const i=ALBUMS.findIndex((_,k)=>!save.s[k]);return i<0?ALBUMS.length-1:i};
const starStr=n=>'★'.repeat(n)+'<i>'+'★'.repeat(3-n)+'</i>';

/* ---------- sound: a small synthesized band ---------- */
let ac,master,dSend,rSend,noiseBuf,shape;
function audio(){
  if(!ac){
    const C=window.AudioContext||window.webkitAudioContext;if(!C)return false;ac=new C();
    master=ac.createGain();master.gain.value=.75;master.connect(ac.createDynamicsCompressor()).connect(ac.destination);
    const dl=ac.createDelay(1.5),fb=ac.createGain(),lp=ac.createBiquadFilter();dl.delayTime.value=.42;fb.gain.value=.4;lp.type='lowpass';lp.frequency.value=2200;
    dl.connect(lp);lp.connect(fb);fb.connect(dl);lp.connect(master);dSend=ac.createGain();dSend.connect(dl);dSend._d=dl;
    const n=Math.floor(ac.sampleRate*1.8),ir=ac.createBuffer(2,n,ac.sampleRate);
    for(let ch=0;ch<2;ch++){const d=ir.getChannelData(ch);for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/n,2.6)}
    const cv=ac.createConvolver();cv.buffer=ir;rSend=ac.createGain();rSend.gain.value=.55;rSend.connect(cv);cv.connect(master);
    noiseBuf=ac.createBuffer(1,ac.sampleRate,ac.sampleRate);const nd=noiseBuf.getChannelData(0);for(let i=0;i<nd.length;i++)nd[i]=Math.random()*2-1;
    shape=new Float32Array(512);for(let i=0;i<512;i++)shape[i]=Math.tanh((i/255.5-1)*5);
  }
  if(ac.state==='suspended')ac.resume();
  return true;
}
const now=()=>ac?ac.currentTime-(ac.outputLatency||ac.baseLatency||0):0;
function out(v,d,r){
  const g=ac.createGain();g.gain.value=v;g.connect(master);
  if(d){const s=ac.createGain();s.gain.value=d;g.connect(s);s.connect(dSend)}
  if(r){const s=ac.createGain();s.gain.value=r;g.connect(s);s.connect(rSend)}
  return g;
}
function osc(type,f,t,dur,dest,det){const o=ac.createOscillator();o.type=type;o.frequency.value=f;if(det)o.detune.value=det;o.connect(dest);o.start(t);o.stop(t+dur+.08);return o}
function env(t,a,d,peak){const g=ac.createGain();g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(peak||1,t+a);g.gain.exponentialRampToValueAtTime(.0001,t+a+d);return g}
function nz(t,dur,type,freq,q){const s=ac.createBufferSource(),f=ac.createBiquadFilter();s.buffer=noiseBuf;f.type=type;f.frequency.value=freq;f.Q.value=q||1;s.connect(f);s.start(t,Math.random()*.5,dur+.05);return f}
function filt(type,f){const b=ac.createBiquadFilter();b.type=type;b.frequency.value=f;return b}
const I={
  kick(t,v){const g=env(t,.002,.22),o=osc('sine',160,t,.25,g);o.frequency.setValueAtTime(160,t);o.frequency.exponentialRampToValueAtTime(48,t+.14);
    const c=env(t,.001,.03,.5);nz(t,.03,'highpass',1500).connect(c);const d=out(v);g.connect(d);c.connect(d)},
  snare(t,v,r){const g=env(t,.001,.16);nz(t,.18,'bandpass',1900,.7).connect(g);const b=env(t,.001,.09,.7),o=osc('triangle',210,t,.1,b);
    o.frequency.exponentialRampToValueAtTime(130,t+.08);const d=out(v,0,r);g.connect(d);b.connect(d)},
  hat(t,v){const g=env(t,.001,.04);nz(t,.05,'highpass',7500).connect(g);g.connect(out(v))},
  clap(t,v){const d=out(v,0,.3);[0,.012,.026].forEach(o=>{const g=env(t+o,.001,.07);nz(t+o,.08,'bandpass',1300,1.2).connect(g);g.connect(d)})},
  bass(t,m,v,len){len=len||.32;const f=F(m+12),lp=filt('lowpass',1500),g=env(t,.005,len);lp.frequency.setValueAtTime(1500,t);lp.frequency.exponentialRampToValueAtTime(380,t+len);
    osc('sawtooth',f,t,len,lp);osc('square',f/2,t,len,lp);lp.connect(g);g.connect(out(v))},
  guitar(t,m,v,a){const pre=ac.createGain(),ws=ac.createWaveShaper(),lp=filt('lowpass',3200),g=env(t,.004,a.glen);pre.gain.value=a.drive*.35;ws.curve=shape;
    [m+12,m+19,m+24].forEach((n,k)=>{osc('sawtooth',F(n),t,a.glen,pre,k?6:-6)});pre.connect(ws);ws.connect(lp);lp.connect(g);g.connect(out(v/Math.sqrt(a.drive+.4),a.dly*.6,a.rev))},
  keys(t,m,v,a,third){
    const notes=[m+24,m+24+third,m+31],d=out(v,a.dly,a.rev);
    if(a.keys==='synth'){const lp=filt('lowpass',600),g=env(t,.03,1.1);lp.frequency.setValueAtTime(600,t);lp.frequency.exponentialRampToValueAtTime(3200,t+.12);lp.frequency.exponentialRampToValueAtTime(700,t+1);
      notes.forEach(n=>{osc('sawtooth',F(n),t,1.1,lp,8);osc('square',F(n),t,1.1,lp,-8)});lp.connect(g);g.connect(d)}
    else if(a.keys==='brass'){const lp=filt('lowpass',400),g=env(t,.02,.3);lp.frequency.setValueAtTime(400,t);lp.frequency.exponentialRampToValueAtTime(2800,t+.05);lp.frequency.exponentialRampToValueAtTime(900,t+.3);
      notes.forEach(n=>{osc('sawtooth',F(n),t,.32,lp,5);osc('sawtooth',F(n-12),t,.32,lp,-5)});lp.connect(g);g.connect(d)}
    else if(a.keys==='piano'){const g=env(t,.003,.7,.8);notes.concat(m+12).forEach(n=>{osc('triangle',F(n),t,.7,g);const h=ac.createGain();h.gain.value=.3;osc('sine',F(n)*2,t,.7,h);h.connect(g)});g.connect(d)}
    else{const g=env(t,.01,.38,.6);notes.forEach(n=>[1,2,3].forEach(h=>{const hg=ac.createGain();hg.gain.value=.6/h;const o=osc('sine',F(n)*h,t,.4,hg);hg.connect(g);
      const l=ac.createOscillator(),lg=ac.createGain();l.frequency.value=6;lg.gain.value=F(n)*h*.006;l.connect(lg);lg.connect(o.frequency);l.start(t);l.stop(t+.5)}));g.connect(d)}
  },

    const tn=now();
    for(let k=0;k<uiq.length;){if(uiq[k].t<=tn){const f=uiq.splice(k,1)[0].fn;f()}else k++}
    if(G&&G.judge&&!G.fail){const good=Math.min(.2,E?E.e*.8:.2);if(G.judge.targets.some(x=>!x.hit&&tn>x.t+good))miss()}
    if(E)spin+=dt*3.4;
    if(!$('game').hidden)drawDeck(tn);
  }
  beatPulse*=Math.pow(.004,dt);hitPulse*=Math.pow(.02,dt);
  if(gl){
    gl.uniform2f(U.r,bg.width,bg.height);gl.uniform1f(U.t,reduce?0:ms/1000);gl.uniform1f(U.beat,reduce?0:beatPulse);gl.uniform1f(U.hit,reduce?0:hitPulse);
    gl.uniform1f(U.kind,scene.kind);gl.uniform3fv(U.c1,scene.pal[0]);gl.uniform3fv(U.c2,scene.pal[1]);gl.uniform3fv(U.c3,scene.pal[2]);
    gl.drawArrays(gl.TRIANGLE_STRIP,0,4);
  }
  drawSparks();
  requestAnimationFrame(frame);
}
renderShelf();sizeCanvases();requestAnimationFrame(frame);
</script>
